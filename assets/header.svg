<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="bounds">
      <rect width="1200" height="200"/>
    </clipPath>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080604;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#100c04;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff8e7;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#f0c040;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#c87828;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7a4010;stop-opacity:1" />
    </linearGradient>

    <filter id="bladeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur3" />
      <feGaussianBlur stdDeviation="8" result="blur8" />
      <feGaussianBlur stdDeviation="15" result="blur15" />
      <feMerge>
        <feMergeNode in="blur15" />
        <feMergeNode in="blur8" />
        <feMergeNode in="blur3" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title {
        fill: url(#bladeGradient);
        font-family: 'Georgia', serif;
        font-size: 95px;
        font-weight: 900;
        letter-spacing: 8px;
        text-transform: uppercase;
        filter: drop-shadow(0px 0px 10px #c87828);
      }
      .slash { fill: none; stroke-width: 1; }

      @keyframes shimmer {
        0%   { opacity: 0.06; }
        50%  { opacity: 0.16; }
        100% { opacity: 0.06; }
      }
      @keyframes shimmer-alt {
        0%   { opacity: 0.12; }
        50%  { opacity: 0.04; }
        100% { opacity: 0.12; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- Diagonal slash lines — light catching a blade at different angles -->
  <g clip-path="url(#bounds)">

    <!-- Primary slashes — top-left to bottom-right -->
    <line class="slash" stroke="#f0c040" x1="-100" y1="0"   x2="300"  y2="200" style="animation: shimmer 4s ease-in-out infinite; animation-delay: 0s" />
    <line class="slash" stroke="#c87828" x1="100"  y1="0"   x2="500"  y2="200" style="animation: shimmer 4s ease-in-out infinite; animation-delay: 0.6s" />
    <line class="slash" stroke="#f0c040" x1="350"  y1="0"   x2="750"  y2="200" style="animation: shimmer 4s ease-in-out infinite; animation-delay: 1.2s" />
    <line class="slash" stroke="#c87828" x1="600"  y1="0"   x2="1000" y2="200" style="animation: shimmer 4s ease-in-out infinite; animation-delay: 1.8s" />
    <line class="slash" stroke="#f0c040" x1="850"  y1="0"   x2="1250" y2="200" style="animation: shimmer 4s ease-in-out infinite; animation-delay: 2.4s" />
    <line class="slash" stroke="#c87828" x1="1050" y1="0"   x2="1400" y2="200" style="animation: shimmer 4s ease-in-out infinite; animation-delay: 0.3s" />

    <!-- Counter slashes — top-right to bottom-left -->
    <line class="slash" stroke="#f0c040" x1="1300" y1="0"   x2="900"  y2="200" style="animation: shimmer-alt 5s ease-in-out infinite; animation-delay: 0.8s" />
    <line class="slash" stroke="#c87828" x1="1050" y1="0"   x2="650"  y2="200" style="animation: shimmer-alt 5s ease-in-out infinite; animation-delay: 1.6s" />
    <line class="slash" stroke="#f0c040" x1="750"  y1="0"   x2="350"  y2="200" style="animation: shimmer-alt 5s ease-in-out infinite; animation-delay: 2.4s" />
    <line class="slash" stroke="#c87828" x1="450"  y1="0"   x2="50"   y2="200" style="animation: shimmer-alt 5s ease-in-out infinite; animation-delay: 0.4s" />
    <line class="slash" stroke="#f0c040" x1="200"  y1="0"   x2="-200" y2="200" style="animation: shimmer-alt 5s ease-in-out infinite; animation-delay: 1.2s" />

  </g>

  <text x="50%" y="105" dominant-baseline="central" text-anchor="middle" class="title" filter="url(#bladeGlow)">Perseus Blade</text>

</svg>
